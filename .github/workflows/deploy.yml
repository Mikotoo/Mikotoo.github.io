name: Build and deploy site

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发（也便于在 preview 分支上验证构建）
  workflow_dispatch:

# GitHub Pages 部署所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署；新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test content pipeline
        run: pnpm test

      - name: Build site
        # 只读取已提交的 content/、public/ 与 snapshots/；不依赖同级仓库。
        # postbuild 严格检查站内文件链接，缺失即失败。
        run: pnpm build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
